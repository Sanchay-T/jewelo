<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asma Round-5 Weld Fix - 4 scenes, honest QC</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#0e2a16;color:#eee}
header{padding:12px 16px;border-bottom:1px solid #2c5c38}
#stage{display:flex;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
#viewer{flex:3;background:#000;border-radius:12px;min-height:60vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#viewer img{max-width:100%;max-height:75vh;object-fit:contain;background:#fff}
#side{flex:1;min-width:280px;background:#122e1a;border-radius:12px;padding:16px}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px}
.pass{background:#1d5c2e}
.warn{background:#6b5a1e}
.fail{background:#6b1e1e}
.nav{display:flex;gap:8px;justify-content:center;padding:12px}
button{background:#1d5c2e;color:#eee;border:1px solid #3fa34d;border-radius:8px;padding:8px 14px;cursor:pointer}
#dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px}
#dots span{width:10px;height:10px;border-radius:50%;background:#3a6b46;cursor:pointer;display:inline-block}
#dots span.on{background:#fff}
a{color:#9cf}
</style>
</head>
<body>
<header><strong>ROUND-5 WELD FIX - 4 scenes, dual-reviewed (me + independent reviewer)</strong> <span id="count"></span></header>
<div id="stage">
<div id="viewer"><img id="img" alt="shot"></div>
<div id="side">
<div id="meta"></div>
<div class="nav"><button id="prev">Prev</button><button id="next">Next</button></div>
<div id="dots"></div>
<div><a id="orig" target="_blank">Open full-res original</a></div>
</div>
</div>
<script>
const DATA=[
{id:"457996f2-7dcc-4bb2-97ad-86c3278adb90",look:"1 Navy night",file:"round5_navy_457996f2.png",norm:"round5_navy_457996f2.jpg",qc:"disputed",note:"I read hamza as fused at full res; 2nd reviewer reads an air line above stem. ء rail-welded. You decide on zoom."},
{id:"b3eb13c0-23e8-479c-be7c-e688dc03af82",look:"2 Linen daylight pavé",file:"round5_linen_b3eb13c0.png",norm:"round5_linen_b3eb13c0.jpg",qc:"fail",note:"Gorgeous full pavé (style drift, not requested) but أ foot joins the س baseline - required أ-س gap missing. Nothing floating."},
{id:"a4cd7fad-486a-40fd-923e-516c3b09772f",look:"3 Fingers held - CLEANEST",file:"round5_fingers_a4cd7fad.png",norm:"round5_fingers_a4cd7fad.jpg",qc:"pass",note:"Both reviewers agree: س-م-ا continuous, أ gapped with fused hamza, ء welded, chains attached both ends."},
{id:"cc45c0ac-b448-46a9-9f16-3f83abdb6fbd",look:"4 Gift box",file:"round5_giftbox_cc45c0ac.png",norm:"round5_giftbox_cc45c0ac.jpg",qc:"fail",note:"أ foot joins س baseline; sunburst stone sits on م. Physically connected, script impure."}
];
let i=0;
const img=document.getElementById('img');
function show(){
const d=DATA[i];
img.src='normalized/'+d.norm;
const cls=d.qc==='pass'?'pass':(d.qc==='fail'?'fail':'warn');
document.getElementById('meta').innerHTML='<span class="badge '+cls+'">'+d.qc+'</span><h3>'+d.look+'</h3><p>'+d.note+'</p><p><small>'+d.id+'</small></p>';
document.getElementById('orig').href='originals/'+d.file;
document.getElementById('count').textContent=(i+1)+' / '+DATA.length;
const dots=document.getElementById('dots');dots.innerHTML='';
DATA.forEach((x,idx)=>{const s=document.createElement('span');if(idx===i)s.classList.add('on');s.onclick=()=>{i=idx;show()};dots.appendChild(s)});
}
document.getElementById('prev').onclick=()=>{i=(i-1+DATA.length)%DATA.length;show()};
document.getElementById('next').onclick=()=>{i=(i+1)%DATA.length;show()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});
show();
</script>
</body>
</html>
