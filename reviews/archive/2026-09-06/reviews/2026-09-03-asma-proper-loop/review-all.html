<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#0e2a16;color:#eee}
header{padding:12px 16px;border-bottom:1px solid #2c5c38;position:sticky;top:0;background:#0e2a16;z-index:5}
#filters{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #2c5c38}
#filters button.on{background:#3fa34d}
#stage{display:flex;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
#viewer{flex:3;background:#000;border-radius:12px;min-height:60vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#viewer img{max-width:100%;max-height:72vh;object-fit:contain;background:#fff}
#side{flex:1;min-width:300px;background:#122e1a;border-radius:12px;padding:16px}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;margin-right:6px}
.pass{background:#1d5c2e}
.warn{background:#6b5a1e}
.fail{background:#6b1e1e}
.legacy{background:#444}
.combo{background:#0b1f11;border:1px solid #2c5c38;border-radius:8px;padding:8px;margin:8px 0;font-size:12px}
.nav{display:flex;gap:8px;justify-content:center;padding:12px}
button{background:#1d5c2e;color:#eee;border:1px solid #3fa34d;border-radius:8px;padding:8px 14px;cursor:pointer}
#dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px;max-height:120px;overflow:auto}
#dots span{width:10px;height:10px;border-radius:50%;background:#3a6b46;cursor:pointer;display:inline-block}
#dots span.on{background:#fff}
#dots span.f{border:2px solid #c33}
#dots span.p{border:2px solid #3c3}
a{color:#9cf}
small.mono{font-family:monospace;font-size:11px}
</style>
</head>

</div>

let filter="all";
let list=DATA.slice();
let i=0;
const img=document.getElementById('img');
function cls(q){return q==='pass'?'pass':(q==='fail'?'fail':(q==='disputed'?'warn':'legacy'))}
function apply(f){filter=f;list=f==='all'?DATA.slice():f==='notpass'?DATA.filter(d=>d.qc==='fail'||d.qc==='disputed'):f==='pass'?DATA.filter(d=>d.qc==='pass'):DATA.filter(d=>d.r===f);i=0;show();
document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));}
function show(){
if(!list.length){document.getElementById('meta').innerHTML='<p>No images in this filter.</p>';return}
const d=list[i%list.length];
img.src='normalized/'+d.norm;
document.getElementById('meta').innerHTML='<span class="badge '+cls(d.qc)+'">'+d.qc+'</span><span class="badge legacy">'+d.r+'</span><h3>'+d.look+'</h3><div class="combo"><b>Combination:</b> '+d.combo+'</div><p>'+d.note+'</p><p><small class="mono">'+d.id+'</small></p>';
document.getElementById('orig').href='originals/'+d.file;
document.getElementById('zoom').innerHTML=d.zoom?('<a href="normalized/'+d.zoom+'" target="_blank">zoom: first letter</a>'):'';
document.getElementById('count').textContent=((i%list.length)+1)+' / '+list.length;
const dots=document.getElementById('dots');dots.innerHTML='';
list.forEach((x,idx)=>{const s=document.createElement('span');if(idx===(i%list.length))s.classList.add('on');s.classList.add(x.qc==='pass'?'p':(x.qc==='fail'?'f':''));s.title=x.look+' ['+x.qc+']';s.onclick=()=>{i=idx;show()};dots.appendChild(s)});
}
document.getElementById('prev').onclick=()=>{i=(i-1+list.length)%list.length;show()};
document.getElementById('next').onclick=()=>{i=(i+1)%list.length;show()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>apply(b.dataset.f));
show();
</script>
