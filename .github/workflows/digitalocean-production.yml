name: digitalocean-production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact staging-tested commit SHA from rebuild/v2-first-principles
        required: true
        type: string
      staging_deployment_id:
        description: Staging deployment ID that successfully tested this commit
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: digitalocean-production
  cancel-in-progress: false

jobs:
  verify-deploy:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        name: Verify the requested source revision
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin rebuild/v2-first-principles --tags
          git cat-file -e "${REQUESTED_SHA}^{commit}"
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/rebuild/v2-first-principles
          tag="jewelo-production-${REQUESTED_SHA}"
          git checkout --detach "$REQUESTED_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require the integrated application lockfile
        run: test -s pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm do:build
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Verify the staging deployment evidence
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
        run: |
          [[ "$STAGING_DEPLOYMENT_ID" =~ ^[0-9a-f-]{36}$ ]]
          source scripts/digitalocean/common.sh
          staging_app_id="$(find_app_id jewelo-staging)"
          doctl apps get-deployment "$staging_app_id" "$STAGING_DEPLOYMENT_ID" --output json |
            node -e '
              let input = "";
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(input);
                const deployment = Array.isArray(value) ? value[0] : value;
                const phase = deployment.phase;
                const matches = deployment.services?.some(
                  (service) => service.source_commit_hash === process.env.REQUESTED_SHA,
                );
                if (phase !== "ACTIVE" || !matches) process.exit(1);
              });
            '
      - name: Publish the immutable production source tag
        run: |
          tag="${{ steps.source.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "${{ inputs.commit_sha }}"
          else
            git tag "$tag" "${{ inputs.commit_sha }}"
            git push origin "refs/tags/${tag}"
          fi
      - id: deploy
        name: Deploy the immutable production source tag
        run: bash scripts/digitalocean/deploy.sh production "${{ steps.source.outputs.tag }}"
      - name: Smoke test production
        run: bash scripts/digitalocean/smoke.sh "${{ steps.deploy.outputs.service_url }}"
      - name: Publish deployment summary
        run: |
          {
            echo "## Jewelo production"
            echo "- URL: ${{ steps.deploy.outputs.service_url }}"
            echo "- Deployment: ${{ steps.deploy.outputs.deployment_id }}"
            echo "- Commit: ${{ inputs.commit_sha }}"
            echo "- Source tag: ${{ steps.source.outputs.tag }}"
            echo "- Rollback: \`pnpm do:rollback -- production PREVIOUS_DEPLOYMENT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
