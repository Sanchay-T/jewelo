name: foundation-ci

on:
  pull_request:
  push:
    branches:
      - rebuild/v2-first-principles

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
