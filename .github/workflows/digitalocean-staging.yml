name: digitalocean-staging

on:
  push:
    branches:
      - codex/digitalocean-staging-preview
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digitalocean-staging
  cancel-in-progress: true

jobs:
  verify-deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DIGITALOCEAN_DEPLOY_ENABLED == 'true'
    environment: Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a deployment-branch commit
        run: |
          git fetch origin codex/digitalocean-staging-preview --tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/codex/digitalocean-staging-preview
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require the integrated application lockfile
        run: test -s pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm do:build
      - id: source
        name: Pin the verified staging source revision
        run: |
          tag="jewelo-staging-${GITHUB_SHA}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - id: deploy
        name: Deploy staging source revision
        run: bash scripts/digitalocean/deploy.sh staging "${{ steps.source.outputs.tag }}"
      - name: Smoke test staging
        run: bash scripts/digitalocean/smoke.sh "${{ steps.deploy.outputs.service_url }}"
      - name: Publish deployment summary
        run: |
          {
            echo "## Jewelo staging"
            echo "- URL: ${{ steps.deploy.outputs.service_url }}"
            echo "- Deployment: ${{ steps.deploy.outputs.deployment_id }}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Source tag: ${{ steps.source.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
